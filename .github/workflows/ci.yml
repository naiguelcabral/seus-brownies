name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate Python used by repository guards
        run: python3 -c "import fcntl, json, pathlib, sys; assert sys.version_info[:2] == (3, 12)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run check
      - run: npm run typecheck
      - name: Check full-project Knip baseline
        run: npm run knip:check
      - name: Validate isolated build on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build:ci-isolated
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Validate isolated HML build on pull requests and work branches
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: npm run build:hml
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
