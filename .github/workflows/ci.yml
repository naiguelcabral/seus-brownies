name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:hml
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
