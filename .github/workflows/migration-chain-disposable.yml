name: Migration chain disposable PostgreSQL 17

on:
  pull_request:
    paths:
      - 'scripts/migration-chain-*.mjs'
      - 'scripts/migration-chain-*.sql'
      - 'scripts/test-migration-chain-disposable.mjs'
      - 'scripts/test-migration-chain-forward-disposable.mjs'
      - 'test/migration-chain-forward-candidate.test.ts'
      - 'test/migration-chain-readiness.test.ts'
      - 'test/fixtures/migration-chain-forward-catalogs.json'
      - 'scripts/test-auth-baseline-disposable.mjs'
      - 'scripts/auth-baseline-payload.mjs'
      - 'scripts/test-scoped-upgrade-disposable.mjs'
      - 'test/migration-chain-scoped-payload.test.ts'
      - 'test/migration-chain-candidates.test.ts'
      - 'test/migration-chain-access-diagnostic.test.ts'
      - 'test/migration-chain-preflight.test.ts'
      - 'test/fixtures/migration-chain-source-manifest.json'
      - 'drizzle/**'
      - '.github/workflows/migration-chain-disposable.yml'
  push:
    branches:
      - 'codex/migration-chain-repair-candidates'
      - 'codex/migration-0017-isolated-repair'
      - 'codex/generic-migration-path'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cacau_chain_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cacau_chain_disposable
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cacau_chain_test -d cacau_chain_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test-migration-chain-disposable.mjs --ack-disposable-postgres17
      - run: node --import tsx scripts/test-auth-baseline-disposable.mjs --ack-disposable-postgres17
      - run: node --import tsx scripts/test-scoped-upgrade-disposable.mjs --ack-disposable-postgres17
      - run: node --import tsx scripts/test-migration-chain-forward-disposable.mjs --ack-disposable-postgres17
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: migration-chain-synthetic-evidence
          path: |
            /tmp/cacau-chain-evidence-*/*.json
            /tmp/cacau-auth-baseline-evidence-*/*.json
            /tmp/cacau-scoped-upgrade-evidence-*/*.json
            /tmp/cacau-forward-evidence-*/*.json
          retention-days: 7
